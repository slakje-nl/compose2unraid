version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
